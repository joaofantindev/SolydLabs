{# Ícones SVG inline — sem dependência externa #}
{% macro icon(name, size=20, cls='') -%}

<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>

<circle cx="12" cy="9" r="5.5"/><path d="M8.2 13.4 7 22l5-2.5 5 2.5-1.2-8.6"/>

<rect x="2.5" y="4" width="19" height="16" rx="3"/><path d="m7 9 3 3-3 3M13 15h4"/>

<circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.2 2.3 3.3 5.2 3.3 8.5s-1.1 6.2-3.3 8.5c-2.2-2.3-3.3-5.2-3.3-8.5S9.8 5.8 12 3.5Z"/>

<rect x="3" y="3.5" width="18" height="7" rx="2"/><rect x="3" y="13.5" width="18" height="7" rx="2"/><path d="M7 7h.01M7 17h.01M11 7h4M11 17h4"/>

<path d="M4 7h16M4 12h16M4 17h16"/>

<path d="M8 4a3 3 0 1 1-3 3v10a3 3 0 1 1 3-3h8a3 3 0 1 1 3 3V7a3 3 0 1 1-3 3H8Z"/>

{%- elif name == 'info' -%}

<path d="M13 2 4.5 13.5H11l-1 8.5 8.5-11.5H12l1-8.5Z"/>

<circle cx="12" cy="12" r="8.5"/>
{%- endif -%}
